# =============================================================================
# MeinRoots — nginx.
#
#   https://meinroots.de           candidate site + its API
#   https://www.meinroots.de       redirects to the apex
#   https://admin.meinroots.de     internal review console + its API
#
# Two hostnames, two certificates, two document roots. The console is not
# reachable from the candidate site: nothing links to it, /admin returns 404
# there, and because the hostnames differ the session cookies are host-only —
# a candidate's cookie is never sent to the console's origin, and vice versa.
# That is the real isolation the earlier port split could not give.
#
# Certificates are issued with `certbot certonly --webroot`, NOT with the nginx
# plugin: the plugin rewrites this file, which would make the copy in the repo
# stop matching the box. Renewal only needs the ACME location below to stay
# reachable over plain HTTP.
#
# Install:
#   cp nginx.conf /etc/nginx/sites-available/meinroots
#   ln -sf /etc/nginx/sites-available/meinroots /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#
#   # Ubuntu's own nginx.conf sets ssl_protocols and ssl_prefer_server_ciphers
#   # in the http block, and its defaults still allow TLS 1.0 and 1.1. This file
#   # is included inside that same block, so setting them here without removing
#   # them there is a duplicate-directive error. Comment the originals out:
#   sed -i 's/^\(\s*\)ssl_protocols/\1# ssl_protocols/;
#           s/^\(\s*\)ssl_prefer_server_ciphers/\1# ssl_prefer_server_ciphers/' \
#       /etc/nginx/nginx.conf
#
#   nginx -t && systemctl reload nginx
# =============================================================================

proxy_read_timeout 120s;
proxy_send_timeout 120s;

# Shared TLS settings. Mozilla "intermediate": TLS 1.2 and 1.3 only, which every
# browser from the last decade speaks and nothing older. See the note above —
# the distribution's own values must be commented out for these to apply.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;

# ---------------------------------------------------------------------------
# Reusable API proxy. Included by both hostnames so the two can never drift.
# ---------------------------------------------------------------------------
# (nginx has no macros; the block is repeated below and must be kept in step.)

# ===========================================================================
# Port 80 — ACME challenges, and a redirect to HTTPS for everything else.
# ===========================================================================
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  # Must stay on plain HTTP: it is how Let's Encrypt proves we control the
  # domain, at issue time and at every renewal.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ===========================================================================
# Candidate site — https://meinroots.de
# ===========================================================================
server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name meinroots.de;

  ssl_certificate     /etc/letsencrypt/live/meinroots.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/meinroots.de/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/meinroots.de/chain.pem;

  root /opt/meinroots/client;
  index index.html;

  # Uploads are capped at 10 MB by the API; nginx must allow slightly more or
  # it rejects with its own 413 before the API can explain why.
  client_max_body_size 12M;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Nothing administrative lives on this origin. Without this the SPA fallback
  # would answer /admin with index.html — a 200 and a page, which tells anyone
  # probing that the path is "something". A flat 404 is the truth.
  location ~ ^/(admin|administrator|backend|console|manage|wp-admin|wp-login)(/|$) {
    return 404;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Without these the API sees every request as coming from 127.0.0.1, which
    # would make the rate limiters global and the audit log worthless.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
  }

  # Content-hashed filenames, so caching them forever is safe.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # A missing chunk must 404, never fall through to index.html — HTML served
    # as JavaScript surfaces as "Unexpected token '<'" and nothing else.
    try_files $uri =404;
  }

  # The security headers are repeated here on purpose: nginx's add_header does
  # not merge with the parent level, it replaces it. Declaring Cache-Control
  # alone would silently drop every header set above — and this is the location
  # every page view lands in, via the SPA fallback below.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# ===========================================================================
# www — one canonical hostname, so cookies and links have one home.
# ===========================================================================
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.meinroots.de;

  ssl_certificate     /etc/letsencrypt/live/meinroots.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/meinroots.de/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  return 301 https://meinroots.de$request_uri;
}

# ===========================================================================
# Review console — https://admin.meinroots.de
# ===========================================================================
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.meinroots.de;

  ssl_certificate     /etc/letsencrypt/live/admin.meinroots.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.meinroots.de/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/admin.meinroots.de/chain.pem;

  root /opt/meinroots/admin;
  index index.html;

  client_max_body_size 2M;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  # No framing at all: this tool is never embedded anywhere.
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  # -------------------------------------------------------------------------
  # Optional second gate. The hostname is NOT a secret — every certificate is
  # published to Certificate Transparency logs, so admin.meinroots.de is
  # discoverable by anyone who looks. Obscurity is not the control here; the
  # role check in the API is. Either of these adds a real second one.
  #
  # Office / home IP only:
  #   allow 203.0.113.4;
  #   deny all;
  #
  # Extra password in front of the app:
  #   apt-get install -y apache2-utils
  #   htpasswd -c /etc/nginx/.meinroots-admin yourname
  #   auth_basic "MeinRoots";
  #   auth_basic_user_file /etc/nginx/.meinroots-admin;
  #   # and exclude the API, or the console's own fetches will 401:
  #   # location /api/ { auth_basic off; ... }
  # -------------------------------------------------------------------------

  # The console talks to the same API, proxied on this hostname too, so it
  # stays same-origin: no CORS exception and no third-party cookie problem.
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# ===========================================================================
# Anything else on 443 — a bare IP, or a wildcard subdomain nobody configured.
#
# DNS is a wildcard, so *.meinroots.de all point here. Without this block they
# would fall to the default server and quietly serve the candidate site under
# an arbitrary hostname. 444 closes the connection without a response.
# ===========================================================================
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name _;

  ssl_certificate     /etc/letsencrypt/live/meinroots.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/meinroots.de/privkey.pem;

  return 444;
}
