# =============================================================================
# MeinRoots — two separate origins.
#
#   :80    the candidate site + the API it needs
#   :8443  the internal review console + the API it needs
#
# The console is NOT reachable from the public site. There is no /admin path on
# port 80, nothing on the site links to the console, and the console links back
# to nothing. A candidate poking at the site cannot discover that a review tool
# exists, let alone find its address.
#
# Honest limitation to know about: a different port is a different origin for
# CORS, but cookies ignore ports. A session cookie set on this host is sent to
# both ports. That is fine here — the API authorises every admin route by role,
# not by which port asked — but it means the ports are a discoverability and
# access-control boundary, not a cryptographic one. Real isolation is a separate
# hostname with its own certificate, which is available the moment a domain
# exists.
#
# Install:
#   cp nginx.conf /etc/nginx/sites-available/meinroots
#   ln -sf /etc/nginx/sites-available/meinroots /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# TLS: once a domain points here, `certbot --nginx` rewrites these blocks for
# HTTPS. Do that before launch — and set COOKIE_SECURE=true in the API's .env at
# the same time.
# =============================================================================

# Shared by both server blocks.
proxy_read_timeout 120s;
proxy_send_timeout 120s;

# -----------------------------------------------------------------------------
# Candidate site — public.
# -----------------------------------------------------------------------------
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /opt/meinroots/client;
  index index.html;

  # Uploads are capped at 10 MB by the API; nginx must allow slightly more or it
  # rejects the request with its own 413 before the API can explain why.
  client_max_body_size 12M;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Nothing administrative lives on this origin. Without this, the SPA catch-all
  # below would answer /admin with the candidate index.html — a 200 and a page,
  # which tells anyone probing that the path is "something". A flat 404 says
  # there is nothing here, which is the truth.
  location ~ ^/(admin|administrator|backend|console|manage|wp-admin|wp-login)(/|$) {
    return 404;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Without these the API sees every request as coming from 127.0.0.1, which
    # would make the rate limiters global and the audit log worthless.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
  }

  # Content-hashed filenames, so caching them forever is safe.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # A missing chunk must 404, never fall through to index.html — HTML served
    # as JavaScript surfaces as "Unexpected token '<'" and nothing else.
    try_files $uri =404;
  }

  # index.html must never be stale, or browsers keep asking for asset names that
  # no longer exist after a deploy.
  #
  # The security headers are repeated here on purpose: nginx's add_header does
  # not merge with the parent level, it replaces it. Declaring Cache-Control
  # alone would silently drop every header set on the server block — and this is
  # the location every page view lands in, via the SPA fallback below.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# -----------------------------------------------------------------------------
# Review console — internal. Separate port, separate document root.
# -----------------------------------------------------------------------------
server {
  listen 8443;
  listen [::]:8443;
  server_name _;

  root /opt/meinroots/admin;
  index index.html;

  client_max_body_size 2M;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  # No framing at all: this tool is never embedded anywhere.
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Internal tooling over candidate data — keep it out of every index.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  # ---------------------------------------------------------------------------
  # Optional second gate. Uncomment either block to restrict who can even reach
  # the login form. Both are nginx-level, so they cost nothing to change.
  #
  # Office / home IP only:
  #   allow 203.0.113.4;
  #   deny all;
  #
  # Extra password in front of the app:
  #   apt-get install -y apache2-utils
  #   htpasswd -c /etc/nginx/.meinroots-admin yourname
  #   auth_basic "MeinRoots";
  #   auth_basic_user_file /etc/nginx/.meinroots-admin;
  # ---------------------------------------------------------------------------

  # The console talks to the same API, proxied on this port too, so it stays
  # same-origin: no CORS exception and no third-party cookie problem.
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Same repetition as the public site, and it matters more here: this is the
  # location that serves every console page view, so dropping the noindex and
  # anti-framing headers would undo them entirely.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
